<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#fff7fa">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MCP">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<title>MCP — My CD Player</title>
</head>
<body>
<div id="splash"><div class="splash-logo"><img src="logo.png" alt="MCP — My CD Player"></div></div>
<div id="app">
<header class="topbar glass">
  <button class="brand" id="homeBtn"><img src="logo.png" alt="MCP"><span><strong>MCP</strong><small>My CD Player</small></span></button>
  <div class="top-actions">
    <button class="glass-icon" id="searchBtn">⌕</button>
    <button class="glass-icon" id="themeBtn">☾</button>
  </div>
</header>

<main id="home">
<section class="hero glass">
  <div class="hero-copy"><small>MY COLLECTION</small><h1>나의 앨범</h1><p>좋아하는 음악을 CD처럼 모아두고,<br>내 방식대로 재생해보세요.</p></div>
  <div class="hero-disc"><i>♫</i></div>
</section>

<section class="section-head">
  <div><small>LIBRARY</small><h2 id="albumCount">0 ALBUMS</h2></div>
  <div class="head-actions"><button class="glass-btn" id="sortBtn">가나다순</button><button class="pink-btn" id="newAlbumBtn">＋ 앨범</button></div>
</section>

<section id="empty" class="empty glass">
  <div class="empty-cd">♫</div><h2>앨범이 없네요</h2><p>나만의 첫 번째 CD를 만들어보세요.</p>
  <button class="pink-btn" id="emptyNew">첫 앨범 만들기</button>
</section>
<section id="grid" class="grid"></section>
</main>

<button class="fab" id="fab">＋</button>

<div id="modal"></div>

<div id="player" hidden>
  <div class="player-bg"></div>
  <section class="player glass">
    <button class="close glass-icon" id="playerClose">×</button>
    <div class="player-head"><small>NOW PLAYING</small><span id="playerCounter">1 / 1</span></div>
    <div class="art-stage">
      <div class="art-shadow"></div><div class="big-disc" id="bigDisc"><div class="label"><span>MCP</span></div></div>
      <div class="art-cover" id="playerCover"></div>
    </div>
    <div class="now"><h1 id="nowTitle">노래 제목</h1><p id="nowArtist">가수명</p><div class="album-link" id="nowAlbum">앨범</div></div>
    <div class="progress"><input id="progress" type="range" min="0" max="100" value="0"><div><span id="elapsed">0:00</span><span id="remaining">-0:00</span></div></div>
    <div class="controls">
      <button id="shuffle" class="ctrl">⌘</button><button id="prev" class="ctrl">〈</button><button id="play" class="play">▶</button><button id="next" class="ctrl">〉</button><button id="repeat" class="ctrl">↻</button>
    </div>
    <div class="lyrics-box glass">
      <div class="lyrics-head"><span>LYRICS</span><button id="lyricsEdit" class="glass-btn">가사 편집</button></div>
      <div id="lyricsView" class="lyrics-view"><div class="lyrics-note">♪</div><p>등록된 가사가 없어요.</p></div>
    </div>
    <div class="player-tools"><button id="queueOpen" class="glass-btn">☷ 재생목록</button><button id="sleepBtn" class="glass-btn">◷ 취침 타이머</button></div>
  </section>
</div>

<div id="queuePanel" hidden><div class="queue-back"></div><section class="queue glass"><div class="sheet-handle"></div><div class="sheet-head"><h2>재생목록</h2><button id="queueClose" class="glass-icon">×</button></div><div id="queueList"></div></section></div>

<input id="coverInput" type="file" accept="image/*" hidden>
<input id="audioInput" type="file" accept="audio/*,.mp3,.m4a,.wav,.aac,.ogg" hidden>
<input id="videoInput" type="file" accept="video/*" hidden>
<audio id="audio" preload="metadata"></audio>
</div>
<script src="app.js"></script>
</body>
</html>
