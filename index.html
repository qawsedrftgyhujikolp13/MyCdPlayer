<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#fff7fb" id="themeColor">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MCP">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<title>MCP — My CD Player</title>
</head>
<body>
<div id="splash"><div class="splash-mark"><strong>MCP</strong><span>MY CD PLAYER</span></div><div class="splash-glow"></div></div>

<div id="app">
<header class="nav glass">
  <button class="brand" id="homeBtn"><span><b>MCP</b><small>MY CD PLAYER</small></span></button>
  <div class="nav-actions">
    <button class="icon" id="searchBtn" aria-label="검색">⌕</button>
    
  </div>
</header>

<main>
<section class="hero glass">
  <div class="hero-copy">
    <span class="eyebrow">YOUR DIGITAL MUSIC ROOM</span>
    <h1>음악을<br><em>CD로.</em></h1>
    <p>앨범을 모으고, 원하는 곡만 골라<br>나만의 플레이어로 재생하세요.</p>
    <div class="hero-actions"><button class="pink" id="heroAdd">＋ 새 앨범</button><button class="glass-btn" id="favHeroBtn">♥ 찜한 노래</button></div>
  </div>
  <div class="hero-vinyl"><div class="shine"></div><div class="hero-label">MCP</div><div class="hero-hole"></div></div>
</section>


<section class="library-head">
  <div><span class="eyebrow">LIBRARY</span><h2 id="albumCount">0 ALBUMS</h2></div>
  <div class="filters"><button class="glass-btn active" data-filter="albums">앨범</button><button class="glass-btn" data-filter="fav">♥ 찜</button></div>
</section>

<section id="empty" class="empty glass">
  <div class="empty-vinyl">♪</div><h2>아직 앨범이 없어요</h2><p>첫 번째 CD를 만들어<br>음악을 담아보세요.</p><button class="pink" id="emptyAdd">앨범 만들기</button>
</section>
<section id="albumGrid" class="album-grid"></section>

<section class="tools-section">
  <div class="tools-title">
    <div><span class="eyebrow">TOOLS</span><h2>음악 도구</h2></div>
    <span class="tools-caption">MCP 안에서 바로 작업하세요</span>
  </div>
  <div class="tools-grid">
    <button class="tool-card glass" id="homeMp3Tool">
      <span class="tool-orb mp3">MP3</span>
      <span class="tool-copy"><small>CONVERTER</small><b>MP3 변환기</b><em>영상에서 오디오만 추출</em></span>
      <i>›</i>
    </button>
    <button class="tool-card glass" id="homeTrimTool">
      <span class="tool-orb trim">↔</span>
      <span class="tool-copy"><small>TRIMMER</small><b>길이 조절기</b><em>원하는 구간만 잘라 저장</em></span>
      <i>›</i>
    </button>
  </div>
</section>
</main>
<button class="fab" id="fab">＋</button>
</div>

<div id="modal"></div>

<div id="mini" class="mini glass" hidden>
  <button id="miniMain" class="mini-main"><span class="mini-cover" id="miniCover"><span>♫</span></span><span class="mini-copy"><b id="miniTitle">—</b><small id="miniArtist">—</small></span></button>
  <button id="miniFav" class="mini-ctrl mini-heart" aria-label="찜">♥</button><span id="miniRemain">0:00</span>
<button id="miniPrev" class="mini-ctrl mini-shape" aria-label="이전 곡"><svg viewBox="0 0 24 24"><path d="M7 5v14"/><path d="M19 6 9 12l10 6z"/></svg></button>
<button id="miniPlay" class="mini-ctrl mini-shape" aria-label="재생"><svg class="mini-play-icon" viewBox="0 0 24 24"><path d="M8 5.5 19 12 8 18.5z"/></svg><svg class="mini-pause-icon" viewBox="0 0 24 24"><path d="M8 6v12M16 6v12"/></svg></button>
<button id="miniNext" class="mini-ctrl mini-shape" aria-label="다음 곡"><svg viewBox="0 0 24 24"><path d="M17 5v14"/><path d="m5 6 10 6-10 6z"/></svg></button>
</div>

<div id="player" hidden>
  <div class="player-ambient"></div>
  <section class="full-player">
    <button class="player-close icon" id="playerClose">×</button>
<div class="player-art">
      <div class="back-disc" id="backDisc"></div>
      <div class="front-cover" id="frontCover"></div>
    </div>
    <div class="p-meta"><button id="pFav" class="player-heart" aria-label="찜">♥</button><h1 id="pTitle">—</h1><p id="pArtist">—</p></div>
    <div class="seek"><input id="seek" type="range" min="0" max="100" value="0"><div><span id="pCur">0:00</span><span id="pRemain">-0:00</span></div></div>
    <div class="transport">
      <button id="pShuffle" class="round shape-btn" aria-label="랜덤 재생"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h3.2c3.5 0 4.1 5.8 8.2 5.8H20"/><path d="M17 4l3 3-3 3"/><path d="M4 17h3.2c1.9 0 3-1.2 4-2.6"/><path d="M17 14l3 3-3 3"/></svg></button>
      <button id="pPrev" class="round shape-btn" aria-label="이전 곡"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5v14"/><path d="M19 6 9 12l10 6z"/></svg></button>
      <button id="pToggle" class="play shape-btn" aria-label="재생"><svg class="icon-play" viewBox="0 0 24 24"><path d="M8 5.5 19 12 8 18.5z"/></svg><svg class="icon-pause" viewBox="0 0 24 24"><path d="M8 6v12M16 6v12"/></svg></button>
      <button id="pNext" class="round shape-btn next-arrow" aria-label="다음 곡">
  <span class="next-arrow-out"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 5v14"/><path d="m5 6 10 6-10 6z"/></svg></span>
  <span class="next-arrow-in"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 5v14"/><path d="m5 6 10 6-10 6z"/></svg></span>
</button>
      <button id="pRepeat" class="round shape-btn" aria-label="앨범 반복"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 7h10l-2.5-2.5"/><path d="M18 17H8l2.5 2.5"/><path d="M18 7a4 4 0 0 1 0 6"/><path d="M6 17a4 4 0 0 1 0-6"/></svg></button>
    </div>
    <div class="mode-row"><button id="lyricsBtn" class="glass-btn">♪ 가사</button><button id="queueBtn" class="glass-btn">☷ 재생목록</button></div>
    <section class="lyrics glass" id="lyrics">
      <div class="lyrics-head"><span>LYRICS</span><button id="editLyrics" class="tiny">편집</button></div>
      <div id="lyricsLines"></div>
    </section>
  </section>
</div>

<div id="queue" hidden><div class="sheet-bg"></div><section class="queue-sheet glass"><div class="handle"></div><div class="sheet-head"><h2>재생목록</h2><button id="closeQueue" class="icon">×</button></div><div id="queueList"></div></section></div>

<input id="coverInput" type="file" accept="image/*" hidden>
<input id="songInput" type="file" accept="audio/*,.mp3,.m4a,.wav,.aac,.ogg" hidden>
<input id="videoInput" type="file" accept="video/*" hidden>
<audio id="audio" preload="metadata"></audio>

<script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js"></script>
<script src="app.js"></script>
</body>
</html>
