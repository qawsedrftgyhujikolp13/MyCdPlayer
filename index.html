<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#ff5fa2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MCP">
  <title>MCP — My CD Player</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="splash" class="splash"><div class="splash-logo">MCP</div></div>

  <div id="app" class="app-shell">
    <header class="topbar glass">
      <button id="brandBtn" class="brand" aria-label="홈">
        <span class="brand-mark">M</span>
        <span><b>MCP</b><small>My CD Player</small></span>
      </button>
      <div class="top-actions">
        <button id="themeBtn" class="icon-btn" title="테마">◐</button>
      </div>
    </header>

    <main id="homeView" class="view active">
      <section class="hero">
        <div>
          <p class="eyebrow">MY COLLECTION</p>
          <h1>나의 앨범</h1>
          <p class="sub">좋아하는 음악을 CD처럼 정리해보세요.</p>
        </div>
        <div class="album-count"><b id="albumCount">0</b><span>ALBUMS</span></div>
      </section>
      <section id="albumGrid" class="album-list"></section>
      <button id="addAlbumFab" class="fab" aria-label="앨범 추가">＋</button>
    </main>

    <main id="albumView" class="view">
      <div class="detail-head">
        <button id="backHome" class="back-btn">‹ <span>앨범</span></button>
        <button id="albumMore" class="icon-btn">•••</button>
      </div>
      <section class="album-hero glass">
        <div id="detailCover" class="detail-cover"></div>
        <div class="detail-info">
          <p id="detailArtist" class="muted">아티스트</p>
          <h1 id="detailTitle">앨범</h1>
          <p id="detailDate" class="muted"></p>
        </div>
      </section>
      <section class="track-section">
        <div class="section-title"><span>TRACKS</span><button id="addTrackBtn" class="round-add">＋</button></div>
        <div id="trackList"></div>
      </section>
    </main>
  </div>

  <div id="modalLayer" class="modal-layer hidden">
    <div id="modalBackdrop" class="modal-backdrop"></div>
    <section id="modal" class="modal glass" role="dialog" aria-modal="true"></section>
  </div>

  <audio id="player" preload="metadata"></audio>
  <script>
    // Splash fallback: hide it even if another app script takes a moment to load.
    window.setTimeout(function(){
      var splash = document.getElementById('splash');
      if (splash) splash.classList.add('hide');
    }, 1700);
  </script>
  <script src="app.js"></script>
</body>
</html>
