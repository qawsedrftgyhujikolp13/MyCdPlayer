<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#fff8fb"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"><title>MCP — My Cd Player</title></head><body><div id="splash"><b>MCP</b></div><main class="app"><header><button id="back">‹</button><div><b class="pink">MCP</b> <span id="title">My Cd Player</span></div><button id="home">⌂</button></header><section id="homeView"><div class="hero"><small>MY MUSIC LIBRARY</small><h1>나만의 CD 컬렉션</h1><p>앨범을 만들고, 실제 CD처럼 음악을 들어보세요.</p></div><div id="albums"></div><div id="empty"><strong>앨범이 없네요</strong><br>앨범을 만들어 보아요!</div><button id="addAlbum" class="fab">＋</button></section><section id="albumView"><div id="albumHero"></div><hr><div id="tracks"></div><button id="addTrack" class="fab">＋</button></section><section id="playerView"><div id="playerAlbum"></div><div class="cd"><img id="art"><i></i></div><h2 id="song">곡을 선택하세요</h2><p id="artist"></p><audio id="audio"></audio><input id="progress" type="range" min="0" max="100" value="0"><div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div><div class="controls"><button id="prev">↶</button><button id="play" class="play">▶</button><button id="next">↷</button></div><div class="modes"><button data-m="sequence" class="active">순차</button><button data-m="shuffle">🔀 랜덤</button><button data-m="repeatAll">↻ 전체</button><button data-m="repeatOne">↻ 한곡</button></div></section></main><div id="modal" class="modal"></div><script src="app.js"></script></body></html>
